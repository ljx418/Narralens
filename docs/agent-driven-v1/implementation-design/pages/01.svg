" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">；发现能力、组织流程；不直写工程</text><rect x="760" y="150" width="280" height="190" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="773" y="172" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">常驻Host应用服务</text><text x="773" y="190" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 ProjectCoordinato</text><text x="773" y="208" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">r、Job、批准/产物/事件；持久事实</text><text x="773" y="226" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">不随窗口消失</text><rect x="1105" y="150" width="280" height="190" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="1118" y="172" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">原OpenFilm + M5工作台</text><text x="1118" y="190" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 原播放器/检查器/</text><text x="1118" y="208" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">时间轴保留；当前事项和真实剪辑进</text><text x="1118" y="226" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">展可见</text><rect x="1450" y="150" width="280" height="190" rx="7" fill="#e4edfa" stroke="#54739e"/><text x="1463" y="172" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">SystemControlPanel</text><text x="1463" y="190" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【待新增】 独立非模态侧面板；服务</text><text x="1463" y="208" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">/模型/恢复，打开后仍可编辑</text><rect x="70" y="420" width="1000" height="180" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="83" y="442" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">R4：当前先完整实现已有工程改单镜</text><text x="83" y="460" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 目标→准备候选→比较差异→核对影响→显式确认→提交→原生确认→继续精修。Agent/Host串联准备，不要求日常用户手填comparison </text><text x="83" y="478" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">ID。</text><rect x="1120" y="420" width="580" height="180" rx="7" fill="#e4edfa" stroke="#54739e"/><text x="1133" y="442" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">WorkflowTopBar</text><text x="1133" y="460" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【待新增】 顶部横向、默认折叠；当前目标/等待原因/失联时间可见；展开定位当</text><text x="1133" y="478" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">前阶段，定位回原导演入口。</text><rect x="70" y="690" width="1000" height="180" rx="7" fill="#f4f3ef" stroke="#938a7d"/><text x="83" y="712" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">完整V1目标不缩减</text><text x="83" y="730" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【设计/说明】 从想法→研究/脚本→分镜→素材/声音→可编辑初稿→精修→QC与交付。A真实短片；B完整制作；C长片/三端/全规格。</text><rect x="1120" y="690" width="580" height="180" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="1133" y="712" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">当前状态与批准边界</text><text x="1133" y="730" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【风险与阻塞】 R4原型人工PASS；产品case NOT_RUN；CP-A0未冻结；生产NOT_RELE</text><text x="1133" y="748" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">ASED。开发中产品实体0。历史截图/SVG/定时回报不是生产实现。</text></svg>