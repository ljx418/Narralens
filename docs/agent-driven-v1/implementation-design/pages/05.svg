<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1170" role="img" aria-label="05 事务 数据权威 并发与恢复"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51636c"/></marker></defs><rect width="100%" height="100%" fill="#fcfbf7"/><text x="50" y="48" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#20313c">05 事务 数据权威 并发与恢复</text><text x="50" y="80" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4d5b62">文档设计｜源码 fd3021c｜R4原型已批准；产品NOT_RUN；生产NOT_RELEASED｜已有不代表本轮业务已验</text><polyline points="260,250.0 275.0,250.0 275.0,250.0 290,250.0" fill="none" stroke="#51636c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="510,250.0 525.0,250.0 525.0,250.0 540,250.0" fill="none" stroke="#51636c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="760,250.0 775.0,250.0 775.0,250.0 790,250.0" fill="none" stroke="#51636c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1010,250.0 1025.0,250.0 1025.0,250.0 1040,250.0" fill="none" stroke="#51636c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1260,250.0 1275.0,250.0 1275.0,250.0 1290,250.0" fill="none" stroke="#51636c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1510,250.0 1525.0,250.0 1525.0,250.0 1540,250.0" fill="none" stroke="#51636c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="145" width="220" height="210" rx="7" fill="#e4edfa" stroke="#54739e"/><text x="53" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">读取上下文</text><text x="53" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【待新增】 project/base/s</text><text x="53" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">election</text><text x="53" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">所选产物版本</text><rect x="290" y="145" width="220" height="210" rx="7" fill="#e3f0e7" stroke="#5b8067"/><text x="303" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">准备候选</text><text x="303" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有实体·本轮未复验】 J</text><text x="303" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">ob→proxy/native plan</text><text x="303" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">source/revision不变</text><rect x="540" y="145" width="220" height="210" rx="7" fill="#e3f0e7" stroke="#5b8067"/><text x="553" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">服务器影响</text><text x="553" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有实体·本轮未复验】 </text><text x="553" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">重查source/rights/锁</text><text x="553" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">生成server hash</text><rect x="790" y="145" width="220" height="210" rx="7" fill="#e4edfa" stroke="#54739e"/><text x="803" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">可信批准</text><text x="803" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【待新增】 project/action</text><text x="803" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">/base/hash</text><text x="803" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">期限与授权范围</text><rect x="1040" y="145" width="220" height="210" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="1053" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">受控提交</text><text x="1053" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 最终重验→</text><text x="1053" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">stage/publish</text><text x="1053" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">journal收敛</text><rect x="1290" y="145" width="220" height="210" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="1303" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">原子事实</text><text x="1303" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 revision+</text><text x="1303" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">1 / active_commit</text><text x="1303" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">幂等/approval/outbox</text><rect x="1540" y="145" width="220" height="210" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="1553" y="167" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">编辑区确认</text><text x="1553" y="185" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 真实nativ</text><text x="1553" y="203" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">e loaded回报</text><text x="1553" y="221" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">未确认仍待同步</text><rect x="55" y="440" width="520" height="195" rx="7" fill="#e4edfa" stroke="#54739e"/><text x="68" y="462" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">创作与任务版本分离</text><text x="68" y="480" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【待新增】 creative_artifact/workflow/decision是拟新增创作事实；Jo</text><text x="68" y="498" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">b/attempt/lease已存在底座。它们不自行增加影片revision，也不能恢复</text><text x="68" y="516" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">另一份timeline。</text><rect x="635" y="440" width="520" height="195" rx="7" fill="#e3f0e7" stroke="#5b8067"/><text x="648" y="462" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">既有工程事实保持</text><text x="648" y="480" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有实体·本轮未复验】 project_state、project_transaction、active</text><text x="648" y="498" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">_commit、snapshot、journal、outbox。pointer实际在active_commit；每</text><text x="648" y="516" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">项目单引擎。新表由MAIN在同连接迁移。</text><rect x="1215" y="440" width="520" height="195" rx="7" fill="#e4edfa" stroke="#54739e"/><text x="1228" y="462" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">driver / resource / provider三类边界</text><text x="1228" y="480" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【待新增】 DriverSession限制编排权；worker lease限制执行；Resource</text><text x="1228" y="498" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">Claim分IO/CPU/RAM/GPU；provider未知结果先对账。失联不贸然卸载/重提</text><text x="1228" y="516" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">。</text><rect x="55" y="740" width="1055" height="210" rx="7" fill="#fff0d4" stroke="#aa7a29"/><text x="68" y="762" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">恢复序列与故障矩阵</text><text x="68" y="780" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【已有·需修改】 保留现有：import/legacy→OpenFilm装配→history/adoption/history→通用Coordinator→migration→materialize→outbox。新建/外部受理/</text><text x="68" y="798" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">prepare/发布/DB前后/native未确认/进程退出逐边界测试；0或+1，无分叉。</text><rect x="1170" y="740" width="565" height="210" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="1183" y="762" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#20313c">取消与回退</text><text x="1183" y="780" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">【风险与阻塞】 准备取消后晚到不采用；prepared后按journal收敛。内容回退仅</text><text x="1183" y="798" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#20313c">restore新revision；关UI不删工程。未知费用/结果保留，不凭猜测记0。</text></svg>