<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1430" role="img" aria-label="08 架构风险 回退 与实现准入"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51636c"/></marker></defs><rect width="100%" height="100%" fill="#fcfbf7"/><text x="50" y="48" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#20313c">08 架构风险 回退 与实现准入</text><text x="50" y="80" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4d5b62">文档设计｜源码 fd3021c｜R4原型已批准；产品NOT_RUN；生产NOT_RELEASED｜已有不代表本轮业务已验</text><rect x="50" y="145" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="167" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R01 一般新建/旧演示入口</text><text x="63" y="184" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 ProjectCreationService+origin，失败隔离补偿；关闭新建，不伪造migration；责任：MAIN</text><rect x="50" y="221" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="243" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R02 正式render仍未开放</text><text x="63" y="260" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 真实snapshot render+decode+双导出；无真证据不签导出完成；责任：MAIN+MEDIA</text><rect x="50" y="297" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="319" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R03 双事实/裸写绕过</text><text x="63" y="336" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 单Host/库/引擎/Coordinator，原生allowlist；停新入口保留旧工程；责任：MAIN</text><rect x="50" y="373" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="395" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R04 批准伪造/过期复用</text><text x="63" y="412" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 可信身份、project/action/base/hash/expiry、原子consume；撤未消费授权；责任：MAIN</text><rect x="50" y="449" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="471" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R05 Host提交冒充画面同步</text><text x="63" y="488" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 原生版本回报独立，缺ack显示待同步/unknown；不能代填；责任：MAIN+PRODUCT</text><rect x="50" y="525" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="547" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R06 卸载/新任务/失联竞争</text><text x="63" y="564" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 资源与归属原子检查，未知先核实；停危险动作，不清共享队列；责任：MAIN+MEDIA</text><rect x="50" y="601" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="623" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R07 外部受理未知与重复扣费</text><text x="63" y="640" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 provider receipt/ID对账；unknown不重提，晚到隔离；责任：MEDIA</text><rect x="50" y="677" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="699" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R08 DDL升级/专项恢复顺序</text><text x="63" y="716" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 旧库副本+新库+中断重开；不删库回退，必要时只读/导出恢复；责任：MAIN</text><rect x="50" y="753" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="775" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R09 下载/任意图/模型路径越权</text><text x="63" y="792" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 固定模板/配置、SSRF/大小/许可/授权；停能力保留已验资产；责任：MEDIA</text><rect x="50" y="829" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="851" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R10 合同/所有权漂移</text><text x="63" y="868" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 CP hash、producer/consumer/注册owner分离；先CCR，不放宽schema；责任：MAIN</text><rect x="50" y="905" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="927" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R11 资源耗尽/关库晚回调</text><text x="63" y="944" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 有限并行、全机预约、停止心跳/排空后关DB；保留原失败原因；责任：MAIN+MEDIA</text><rect x="50" y="981" width="1685" height="70" rx="7" fill="#f8e4e1" stroke="#a76258"/><text x="63" y="1003" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R12 短片/禁用项冒充完整V1</text><text x="63" y="1020" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【风险与阻塞】 13P0/6P1/6NFR/AD-E/AD-T/R4逐项真证；阶段范围不替代Full；责任：MAIN</text><rect x="50" y="1100" width="1685" height="180" rx="7" fill="#f4f3ef" stroke="#938a7d"/><text x="63" y="1122" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">当前唯一允许：继续文档闭环与人类审图</text><text x="63" y="1139" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【设计/说明】 已批准R4体验；精确CP-A0仍待冻结，真实provider/三端/性能预算待阶段探针；没有用户实施批准与MAIN ReleaseAssignment，不启动产品代码。Git不reset、不force push，不覆盖用户dirty工作。</text></svg>