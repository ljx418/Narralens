<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1290" role="img" aria-label="07 用户场景 验收门限与出门"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51636c"/></marker></defs><rect width="100%" height="100%" fill="#fcfbf7"/><text x="50" y="48" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#20313c">07 用户场景 验收门限与出门</text><text x="50" y="80" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4d5b62">文档设计｜源码 fd3021c｜R4原型已批准；产品NOT_RUN；生产NOT_RELEASED｜已有不代表本轮业务已验</text><rect x="50" y="145" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="167" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-01 原工作台与唯一选择/时钟</text><text x="63" y="184" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 新面板开关前后可播放/精剪；selection、草稿、版本不重置</text><rect x="50" y="221" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="243" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-02 完整改单镜决策链</text><text x="63" y="260" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 目标→候选→差异→核对→确认→同步→继续；不手填内部ID</text><rect x="50" y="297" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="319" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-03 真实当前与候选比较</text><text x="63" y="336" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 所选proposal/preview/版本匹配；比较revision+0；最终3–6案均可选</text><rect x="50" y="373" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="395" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-04 可信确认与最终重验</text><text x="63" y="412" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 base/锁/许可/impact/approval负向+0；成功恰好+1</text><rect x="50" y="449" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="471" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-05 提交与native确认分开</text><text x="63" y="488" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 延迟native ack时显示待同步，不能填Host值作成功</text><rect x="50" y="525" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="547" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-06 局部返工与取消晚到</text><text x="63" y="564" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 仅相关范围重算；保留旁白/时长；晚到不自动采用</text><rect x="50" y="601" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="623" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-07 顶部横向工作流</text><text x="63" y="640" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 折叠仍有当前事项；展开定位当前步；真实事件p95≤2秒</text><rect x="50" y="677" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="699" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-08 非模态系统控制</text><text x="63" y="716" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 无遮罩/焦点锁、不遮导演栏；打开仍可编辑，关闭仅收起</text><rect x="50" y="753" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="775" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-09 真实模型与资源状态</text><text x="63" y="792" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 请求/加载/预热/就绪分开；活动/未知任务不越权卸载</text><rect x="50" y="829" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="851" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-10 阻塞/断线/过期/未知</text><text x="63" y="868" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 保存草稿、重核原任务；检查不变成重提/重复扣费</text><rect x="50" y="905" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="927" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-11 布局与可访问</text><text x="63" y="944" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 1440×900/1366×768；390审阅模式；方向键/焦点/播报</text><rect x="50" y="981" width="1060" height="70" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="63" y="1003" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">R4-UX-12 真实人验与交付</text><text x="63" y="1020" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 实际改单镜、重开、snapshot绑定双导出与完整decode；用户签署</text><rect x="1170" y="145" width="565" height="240" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="1183" y="167" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">A人验：能带走真实短片</text><text x="1183" y="184" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 启动→新主题/授权素材与录音→60–180秒可编辑初稿→拒绝/采用改单</text><text x="1183" y="201" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">镜→关服重开→双导出。仅签短片范围；未完成AI/多案明确列出。</text><rect x="1170" y="455" width="565" height="240" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="1183" y="477" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">B人验：完整制作与协作</text><text x="1183" y="494" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 任意选案/产物改版/局部重算→并行与接管→固定一图一短视频/声音</text><text x="1183" y="511" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">字幕→8标题4封面→QC阻断/修复→完整交付。</text><rect x="1170" y="765" width="565" height="265" rx="7" fill="#efe7f6" stroke="#86689c"/><text x="1183" y="787" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">C人验：完整V1</text><text x="1183" y="804" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【待验证/未开放】 10–15分钟100+镜母片、3–5分钟20+镜章节、3处局部修改；三端标</text><text x="1183" y="821" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">准链接力。全P0/P1/NFR/21体验/35族+独立外审和人验才Full。</text><rect x="50" y="1100" width="1685" height="115" rx="7" fill="#f4f3ef" stroke="#938a7d"/><text x="63" y="1122" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#20313c">逐项证据与当前状态</text><text x="63" y="1139" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#20313c">【设计/说明】 35个AD-T族详见04_ACCEPTANCE_SCENARIOS.md：每族有场景、步骤、阈值、owner与证据。当前产品全部NOT_RUN；原型PASS不能涂绿产品。Headless与人工记录分列。</text></svg>